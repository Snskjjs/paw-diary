<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爪印 · 养宠成长与社区</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f4;color:#283c35;font:15px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 17px;background:#326d54;color:white}button.secondary{background:#eaf0e8;color:#326d54}aside{position:fixed;width:220px;height:100vh;background:white;border-right:1px solid #e5e9e2;padding:32px 22px}h1,h2,h3,p{margin:0 0 14px}h1{font-size:30px}h2{font-size:21px}h3{font-size:17px}.brand{font-size:26px;font-weight:800;margin-bottom:36px}.muted{color:#87918a;font-size:13px}nav button{display:block;text-align:left;width:100%;margin:8px 0;background:transparent;color:#68786e}nav button.active{background:#eaf2e8;color:#326d54;font-weight:700}main{max-width:1250px;margin-left:220px;padding:36px 44px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.top{margin-bottom:30px}.tag{padding:5px 10px;background:#eef2e8;border-radius:20px;color:#617450;font-size:12px}.hero{background:#e5eddd;padding:30px;border-radius:18px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between}.pet{font-size:78px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:22px 0}.card{padding:24px;background:white;border:1px solid #e7eae2;border-radius:15px;margin-bottom:18px}.number{font-size:30px;font-weight:700}.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}.item{padding:16px 0;border-bottom:1px solid #eef0eb}.item:last-child{border:0}.dot{color:#50916b;margin-right:12px}.timeline{border-left:2px solid #dce7d6;padding-left:25px;margin-left:8px}.timeline .item{position:relative}.timeline .item:before{content:'';position:absolute;width:10px;height:10px;background:#68946e;border:4px solid #f7f8f4;border-radius:50%;left:-35px;top:22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.postart{height:120px;border-radius:12px;background:#f0eadd;display:flex;align-items:center;justify-content:center;font-size:58px;margin:16px 0}.empty{padding:24px;color:#829084}dialog{border:0;border-radius:18px;width:440px;max-width:94vw;padding:28px;color:#283c35}dialog::backdrop{background:#172d2355}label{display:block;margin:12px 0}input,textarea,select{display:block;width:100%;border:1px solid #dce3d8;padding:10px;border-radius:8px;background:white;color:#283c35}footer{margin-top:30px;color:#8c958b;font-size:12px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#284c39;color:white;padding:12px 25px;border-radius:10px;display:none}.smallbtn{padding:6px 12px}.filter{display:flex;gap:12px;margin:20px 0}.filter select{width:auto}@media(max-width:760px){aside{position:static;width:auto;height:auto;padding:16px}.brand{margin-bottom:8px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto;margin:0}main{margin:0;padding:24px 18px}.grid,.cols{grid-template-columns:1fr}.top{align-items:flex-start}.hero{padding:22px}.pet{font-size:55px}}
</style><aside><div class="brand">🐾 爪印<span class="muted" style="display:block">一起记录，每一步成长</span></div><nav id="nav"></nav><p class="muted" style="margin-top:35px">当前宠物</p><b>🐕 豆豆 · 金毛</b></aside><main><div class="top"><div><span class="muted">PAW DIARY / 成长有迹可循</span><h1 id="title"></h1></div><span class="tag">交互原型 · 演示数据</span></div><div id="view"></div><footer>前端概念原型 · 数据保存在当前浏览器 · 附近距离为模拟数据</footer></main><dialog id="modal"><form id="form"><div class="row"><h2 id="modalTitle"></h2><button type="button" class="secondary smallbtn" onclick="modal.close()">✕</button></div><div id="fields"></div><button style="width:100%;margin-top:20px">保存</button></form></dialog><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=0,filter='全部';const tabs=['总览','健康档案','成长时间线','附近宠友','社区日常'];let data;try{data=JSON.parse(localStorage.getItem('paw-demo'))}catch{}data=data||{records:[{type:'体重',value:'18.5 kg',date:'2026-10-20',note:'胃口很好，精神满满'},{type:'疫苗',value:'狂犬疫苗',date:'2026-10-12',note:'已接种，留观正常'},{type:'驱虫',value:'体外驱虫',date:'2026-10-05',note:'已完成本月驱虫'}],posts:[{name:'豆豆的家长',text:'和豆豆一起散步，收集秋天的小快乐 🍂',city:'上海',likes:12},{name:'奶茶的家长',text:'第一次尝试宠物友好咖啡馆，交到新朋友啦！',city:'杭州',likes:8}]};function save(){localStorage.setItem('paw-demo',JSON.stringify(data))}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}function go(n){page=n;render()}function rows(){return data.records.filter(r=>filter==='全部'||r.type===filter).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="item"><span class="tag">${esc(r.type)}</span> <b>${esc(r.value)}</b><div class="muted">${esc(r.date)} · ${esc(r.note)}</div></div>`).join('')||'<p class="empty">暂无记录，添加第一条吧</p>'}function render(){$('#nav').innerHTML=tabs.map((x,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${['◫','♡','◷','⌖','☷'][i]}　${x}</button>`).join('');$('#title').textContent=tabs[page];let v='';if(page===0)v=`<div class="hero"><div><span class="tag">陪伴的第 286 天</span><h2 style="margin-top:15px">今天也要和豆豆一起长大</h2><p>金毛 · 男孩 · 1岁2个月 · 上海市徐汇区</p><button onclick="openRecord()">＋ 记录成长</button></div><div class="pet">🐕</div></div><div class="grid"><div class="card"><span class="muted">最新体重</span><div class="number">${esc(data.records.filter(r=>r.type==='体重').sort((a,b)=>b.date.localeCompare(a.date))[0]?.value||'未记录')}</div><span class="muted">持续记录，了解变化</span></div><div class="card"><span class="muted">健康记录</span><div class="number">${data.records.length} <small>条</small></div><span class="muted">体重 / 疫苗 / 驱虫</span></div><div class="card"><span class="muted">附近宠友</span><div class="number">3 <small>位</small></div><a href="#" onclick="go(3);return false" style="color:#326d54">去认识新朋友 →</a></div></div><div class="cols"><section class="card"><div class="row"><h2>最近成长</h2><button class="secondary smallbtn" onclick="go(2)">全部 →</button></div>${rows()}</section><section class="card"><h2>待办提醒</h2><div class="item">🛡️ 下次体外驱虫<div class="muted">2026-11-05 · 由演示档案提供</div></div><div class="item">⚖️ 记录本周体重<div class="muted">每一次变化都值得记录</div></div><button class="secondary" onclick="openRecord()">添加健康记录</button></section></div>`;if(page===1||page===2)v=`<div class="row"><p class="muted">${page===1?'管理豆豆的每一份健康数据':'把平凡的日子，串成珍贵的成长故事'}</p><button onclick="openRecord()">＋ 添加记录</button></div><div class="filter">${['全部','体重','疫苗','驱虫','日常'].map(x=>`<button class="${filter===x?'':'secondary'} smallbtn" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div class="${page===2?'timeline':'card'}">${rows()}</div>`;if(page===3)v=`<p class="muted">找到同城、同频的养宠伙伴</p><div class="filter"><select id="city" onchange="friends()"><option>上海</option><option>杭州</option><option>北京</option></select><select id="kind" onchange="friends()"><option>全部宠物</option><option>狗狗</option><option>猫咪</option></select><span class="tag">按地域与宠物类型匹配 · 模拟</span></div><div id="friends"></div>`;if(page===4)v=`<div class="row"><p class="muted">分享养宠日常，让陪伴被看见</p><button onclick="openPost()">＋ 发布日常</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${data.posts.map((p,i)=>`<article class="card"><b>🐾 ${esc(p.name)}</b><div class="muted">${esc(p.city)} · 养宠日常</div><div class="postart">${i%2?'🐈 ☕':'🐕 🍂'}</div><p>${esc(p.text)}</p><button class="secondary smallbtn" onclick="data.posts[${i}].likes++;save();render()">♡ ${p.likes}</button></article>`).join('')}</div>`;$('#view').innerHTML=v;if(page===3)friends()}
let followed=new Set;function friends(){const city=$('#city').value,kind=$('#kind').value;const all=[{name:'可乐与小林',kind:'狗狗',pet:'柯基 · 2岁',emoji:'🐶'},{name:'布丁与阿圆',kind:'猫咪',pet:'英短 · 1岁',emoji:'🐱'},{name:'旺仔与小陈',kind:'狗狗',pet:'柴犬 · 3岁',emoji:'🐕'}];$('#friends').innerHTML=all.filter(x=>kind==='全部宠物'||kind===x.kind).map((x,i)=>`<div class="card row"><div><h3>${x.emoji} ${x.name}</h3><div class="muted">${city} · 模拟距离 ${(i+1)*0.8} km · ${x.pet}</div><span class="tag">喜欢散步 · 交流养宠经验</span></div><button class="secondary" onclick="follow('${x.name}',this)">${followed.has(x.name)?'已关注':'＋ 关注'}</button></div>`).join('')}function follow(n,b){followed.has(n)?followed.delete(n):followed.add(n);b.textContent=followed.has(n)?'已关注':'＋ 关注';toast(followed.has(n)?'已关注这位宠友':'已取消关注')}
let mode;function openRecord(){mode='record';$('#modalTitle').textContent='添加成长记录';$('#fields').innerHTML='<label>记录类型<select name="type"><option>体重</option><option>疫苗</option><option>驱虫</option><option>日常</option></select></label><label>日期<input name="date" type="date" value="2026-10-22" required></label><label>记录内容<input name="value" placeholder="例如：19 kg / 接种疫苗 / 第一次游泳" required maxlength="80"></label><label>备注<textarea name="note" placeholder="记录今天的小变化" maxlength="200"></textarea></label>';modal.showModal()}function openPost(){mode='post';$('#modalTitle').textContent='分享养宠日常';$('#fields').innerHTML='<label>所在城市<select name="city"><option>上海</option><option>杭州</option><option>北京</option></select></label><label>这一刻发生了什么？<textarea name="text" rows="5" required maxlength="500" placeholder="分享和毛孩子的小故事…"></textarea></label>';modal.showModal()}$('#form').onsubmit=e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));if(mode==='record')data.records.unshift(obj);else data.posts.unshift({...obj,name:'豆豆的家长',likes:0});save();modal.close();render();toast(mode==='record'?'成长记录已保存':'日常已发布到演示社区')};render();
</script></html>
